# Supabase local development + CI configuration.
# Docs: https://supabase.com/docs/guides/local-development
# This enables `supabase start`, `supabase db reset`, `supabase test db`, and
# deterministic migration validation in CI (see .github/workflows/quality.yml).

# A stable, project-scoped identifier used by the Supabase CLI.
project_id = "mimos-academy-pms-v2"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "private"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[analytics]
enabled = false

# Edge Functions are deployed via `supabase functions deploy`; local serving is off
# by default. They must never receive a service-role key in production.
