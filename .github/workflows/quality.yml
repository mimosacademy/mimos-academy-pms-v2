name: V2 Quality Gate

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  migration-static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify migration field constructors
        run: |
          if grep -R "col\.fields\.add(new Field" apps/pocketbase/pb_migrations; then
            echo "Untyped Field constructor found in migrations."
            exit 1
          fi
      - name: Verify no production data directory is tracked
        run: |
          if git ls-files apps/pocketbase/pb_data | grep -q .; then
            echo "pb_data must never be committed."
            exit 1
          fi
      - name: Verify no demo action handlers remain
        run: |
          if grep -R "demoAction" apps/web/src --include='*.js' --include='*.jsx'; then
            echo "demoAction reference found in production source."
            exit 1
          fi
      - name: Verify mock data is not imported by production source
        run: |
          if grep -R "mockData" apps/web/src --include='*.js' --include='*.jsx' | grep -v '/lib/mockData.js:'; then
            echo "mockData import/reference found in production source."
            exit 1
          fi
      - name: Verify critical business identifiers have unique database constraints
        run: |
          required=(idx_programmes_code_unique idx_quotations_quote_no_unique idx_purchase_orders_po_no_unique idx_invoices_invoice_no_unique idx_payments_payment_no_unique)
          for index_name in "${required[@]}"; do
            if ! grep -RlF "${index_name}" apps/pocketbase/pb_migrations >/dev/null; then
              echo "Missing unique business identifier declaration: ${index_name}"
              exit 1
            fi
          done
          echo "All critical business identifier unique indexes are declared across forward migrations."
      - name: Verify business identifier migrations are idempotent
        run: |
          files=$(grep -RlE 'CREATE UNIQUE INDEX (idx_programmes_code_unique|idx_quotations_quote_no_unique|idx_purchase_orders_po_no_unique|idx_invoices_invoice_no_unique|idx_payments_payment_no_unique)' apps/pocketbase/pb_migrations || true)
          for file in $files; do
            if ! grep -q 'indexes\.some' "$file"; then
              echo "Unique index migration is not guarded for idempotent application: $file"
              exit 1
            fi
          done
          echo "All unique-index migrations are guarded for idempotent application."
      - name: Validate V1 migration PHP syntax
        run: php -l tools/migrate-v1-to-v2.php
      - name: Verify V1 opportunity stages are mapped to V2 schema
        run: |
          if grep -nE "'stage' => \$stage|stageForV2" tools/migrate-v1-to-v2.php >/dev/null && grep -nE "'stage' => '(Early engagement|Qualified lead/Tender in progress|Proposal/Tender submitted|Negotiation stage|Verbal commitment|Contract signed/PO issued|Lost/No-go)'" tools/migrate-v1-to-v2.php >/dev/null; then
            echo "V1-only opportunity stage value is being written directly to V2."
            exit 1
          fi
      - name: Validate PocketBase hook syntax
        run: node --check apps/pocketbase/pb_hooks/financial_integrity.pb.js
      - name: Validate role-matrix smoke script syntax
        run: bash -n tools/role-matrix-smoke.sh

  deployment-config-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Create service account for unit validation
        run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin mimos-pms || true
      - name: Create executable placeholder for unit validation
        run: |
          sudo mkdir -p /var/www/mimos-pms/apps/pocketbase
          sudo ln -sf /usr/bin/true /var/www/mimos-pms/apps/pocketbase/pocketbase
      - name: Validate systemd unit
        run: systemd-analyze verify systemd/mimos-pms.service
      - name: Install NGINX for config validation
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Validate NGINX reverse-proxy configuration
        run: |
          mkdir -p /tmp/mimos-nginx/logs /tmp/mimos-nginx/run
          sed -e 's/listen 80;/listen 8080;/' -e 's/listen \[::\]:80;/listen [::]:8080;/' nginx/mimos-pms-api.conf > /tmp/mimos-nginx/mimos-pms-api.conf
          cat > /tmp/mimos-nginx/nginx.conf <<'EOF'
          pid /tmp/mimos-nginx/run/nginx.pid;
          error_log /tmp/mimos-nginx/logs/error.log;
          events {}
          http {
            access_log /tmp/mimos-nginx/logs/access.log;
            include /etc/nginx/mime.types;
            include /tmp/mimos-nginx/mimos-pms-api.conf;
          }
          EOF
          nginx -t -c /tmp/mimos-nginx/nginx.conf

  pocketbase-smoke:
    runs-on: ubuntu-latest
    needs: migration-static-check
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify PocketBase binary version
        working-directory: apps/pocketbase
        run: |
          chmod +x pocketbase
          expected="$(tr -d '\r\n' < .pocketbase-version)"
          actual="$(./pocketbase --version | head -n 1)"
          echo "Expected PocketBase version: $expected"
          echo "Binary reports: $actual"
          echo "$actual" | grep -F "$expected"
      - name: Run fresh PocketBase migration smoke test
        working-directory: apps/pocketbase
        env:
          PB_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          PB_SUPERUSER_EMAIL: ci-admin@example.invalid
          PB_SUPERUSER_PASSWORD: CiTest-Password-2026-Strong!
        run: |
          rm -rf /tmp/mimos-pb-smoke
          mkdir -p /tmp/mimos-pb-smoke
          ./pocketbase migrate up \
            --encryptionEnv=PB_ENCRYPTION_KEY \
            --dir=/tmp/mimos-pb-smoke \
            --migrationsDir=./pb_migrations \
            --hooksDir=./pb_hooks
          test -f /tmp/mimos-pb-smoke/data.db
          echo "Fresh PocketBase migration completed successfully."
      - name: Boot PocketBase and verify health/auth/role matrix
        working-directory: apps/pocketbase
        env:
          PB_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          PB_SUPERUSER_EMAIL: ci-admin@example.invalid
          PB_SUPERUSER_PASSWORD: CiTest-Password-2026-Strong!
          PB_BASE_URL: http://127.0.0.1:8090
        run: |
          ./pocketbase serve \
            --http=127.0.0.1:8090 \
            --encryptionEnv=PB_ENCRYPTION_KEY \
            --dir=/tmp/mimos-pb-smoke \
            --migrationsDir=./pb_migrations \
            --hooksDir=./pb_hooks > /tmp/mimos-pocketbase.log 2>&1 &
          PB_PID=$!
          trap 'kill $PB_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/api/health >/dev/null
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"identity":"ci-admin@example.invalid","password":"CiTest-Password-2026-Strong!"}' \
            http://127.0.0.1:8090/api/collections/_superusers/auth-with-password >/dev/null
          bash ../../tools/role-matrix-smoke.sh
          echo "PocketBase health, authentication and seven-role authorization verified."
