name: V2 Quality Gate

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (workspace lockfile)
        run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # Static architecture/security checks on the migration source. Fast; no DB.
  supabase-static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify production architecture
        run: |
          grep -q "Supabase Auth + PostgreSQL + Storage + Realtime" README.md
          grep -q "Supabase + Vercel" docs/DEPLOYMENT.md
      - name: Verify unique security migrations
        run: |
          for version in 015 016 017 018 019 020 043 044; do
            test "$(find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" | wc -l)" -eq 1
          done
      - name: Verify no duplicate migration versions
        run: |
          duplicates="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -nE 's/^([0-9]{3})_.*/\1/p' | sort | uniq -d)"
          test -z "$duplicates"
      - name: Verify no broad sensitive RLS
        run: |
          ! grep -R -nEi "create policy .*on public\.(invoice|payment|payment_allocation|invoice_payment_allocation|audit_log|audit_history).*using \(true\)" supabase/migrations
      - name: Verify authorization boundary
        run: |
          ! grep -nE "create or replace function public\.(has_pms_role|can_access_programme|current_staff_id)" supabase/migrations/017_authorization_boundary_hardening.sql
          grep -q "revoke all on function public.is_admin() from public, anon, authenticated" supabase/migrations/017_authorization_boundary_hardening.sql
          grep -q "revoke all on function public.fn_refresh_programme(bigint) from public, anon, authenticated" supabase/migrations/017_authorization_boundary_hardening.sql
          grep -q "revoke all on function public.fn_programme_completeness(bigint) from public, anon, authenticated" supabase/migrations/017_authorization_boundary_hardening.sql
      - name: Verify transaction hardening
        run: |
          grep -q "alter column operation_id set not null" supabase/migrations/018_application_transaction_hardening.sql
          grep -q "alter column operation_id set not null" supabase/migrations/019_application_transaction_hardening.sql
          grep -q "gen_random_uuid()" supabase/migrations/018_application_transaction_hardening.sql
          grep -q "with check (false)" supabase/migrations/018_application_transaction_hardening.sql
      - name: Verify private authorization execution boundary
        run: |
          grep -q "grant usage on schema private to authenticated" supabase/migrations/020_private_authorization_execution.sql
          grep -q "grant execute on function private.has_pms_role" supabase/migrations/020_private_authorization_execution.sql
          grep -q "grant execute on function private.can_access_programme" supabase/migrations/020_private_authorization_execution.sql
          grep -q "create or replace function private.has_pms_role" supabase/migrations/044_private_authorization_helpers.sql
          grep -q "create or replace function private.can_access_programme" supabase/migrations/044_private_authorization_helpers.sql
      - name: Verify staging promotion is service-role only
        run: |
          grep -q "REVOKE EXECUTE ON FUNCTION public.promote_stg_invoice(bigint) FROM authenticated, anon, public" supabase/migrations/015_migration_function_security.sql
          grep -q "REVOKE EXECUTE ON FUNCTION public.promote_stg_quotation(bigint) FROM authenticated, anon, public" supabase/migrations/015_migration_function_security.sql
          grep -q "REVOKE EXECUTE ON FUNCTION public.promote_stg_funnel(bigint) FROM authenticated, anon, public" supabase/migrations/015_migration_function_security.sql
          grep -q "GRANT EXECUTE ON FUNCTION public.promote_stg_invoice(bigint) TO service_role" supabase/migrations/015_migration_function_security.sql
          grep -q "GRANT EXECUTE ON FUNCTION public.promote_stg_quotation(bigint) TO service_role" supabase/migrations/015_migration_function_security.sql
          grep -q "GRANT EXECUTE ON FUNCTION public.promote_stg_funnel(bigint) TO service_role" supabase/migrations/015_migration_function_security.sql
      - name: Verify browser source has no service-role or PocketBase runtime
        run: |
          ! grep -R -nEi "SUPABASE_SERVICE_ROLE_KEY|service_role|service-role|pocketbase|pb_client|apps/pocketbase" apps/web/src --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx'
      - name: Verify production data is not tracked
        run: |
          ! git ls-files apps/pocketbase/pb_data | grep -q .
          ! git ls-files apps/pocketbase/pocketbase | grep -q .
      - name: Verify security markers
        run: |
          grep -q "private.validate_payment_invariants" supabase/migrations/016_security_integrity_hardening.sql
          grep -q "private.validate_allocation_invariants" supabase/migrations/016_security_integrity_hardening.sql
          grep -q "ux_payment_operation_id" supabase/migrations/016_security_integrity_hardening.sql
          grep -q "pms_documents_select" supabase/migrations/016_security_integrity_hardening.sql
          grep -q "prevent_staff_security_field_escalation" supabase/migrations/017_authorization_boundary_hardening.sql
          grep -q "prevent_profile_security_field_escalation" supabase/migrations/017_authorization_boundary_hardening.sql
      - name: Verify no obvious secrets
        run: |
          ! git grep -nEI -- '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^$\{]|sk-[A-Za-z0-9_-]{20,})' -- ':!*.md' ':!docs/*'

  # Best-effort migration/RLS validation inside a disposable local Supabase
  # stack. This is a validation BONUS and is NOT the authoritative gate.
  # `supabase start` on GitHub-hosted runners is unreliable (Docker/Node setup),
  # so this job is declared `continue-on-error`: it does not block the PR. The
  # authoritative migration validation is the operator running
  # `scripts/apply-migrations.sh` against the target Supabase project (see
  # .handoff/DEPLOY_RUNBOOK.md) — CI validates the migration SOURCE via
  # supabase-static-security, and the app via the `web` job.
  supabase-migrations:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install PostgreSQL client for regression checks
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start local Supabase stack
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::warning::Docker is not available on this runner; skipping Supabase migration validation."
            echo "SKIPPED_DOCKER_UNAVAILABLE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          supabase start
      - name: Apply migrations and run security/regression checks
        if: env.SKIPPED_DOCKER_UNAVAILABLE != '1'
        run: bash scripts/db-regression.sh

  deployment-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: test -f apps/web/vercel.json
      # Assertions that PocketBase deployment guidance is gone. The pattern is
      # deliberately precise so it does NOT trip on legacy-documentation wording
      # (e.g. "retired VPS/systemd/nginx files").
      - run: '! grep -nEi "Hostinger VPS for PocketBase|PocketBase backend/database/authentication|start[[:space:]]+(a )?PocketBase|deploy[[:space:]]+PocketBase" docs/DEPLOYMENT.md'
      - run: test -f supabase/config.toml
      - run: test -f apps/web/.env.example
