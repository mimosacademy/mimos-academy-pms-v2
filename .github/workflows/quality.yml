name: V2 Quality Gate

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  migration-static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify migration field constructors
        run: |
          if grep -R "col\.fields\.add(new Field" apps/pocketbase/pb_migrations; then exit 1; fi
      - name: Verify production data is not tracked
        run: |
          if git ls-files apps/pocketbase/pb_data | grep -q .; then exit 1; fi
      - name: Verify no demo handlers
        run: |
          if grep -R "demoAction" apps/web/src --include='*.js' --include='*.jsx'; then exit 1; fi
      - name: Verify no mock data imports
        run: |
          if grep -R "mockData" apps/web/src --include='*.js' --include='*.jsx' | grep -v '/lib/mockData.js:'; then exit 1; fi
      - name: Verify unique business identifiers
        run: |
          required=(idx_programmes_code_unique idx_quotations_quote_no_unique idx_purchase_orders_po_no_unique idx_invoices_invoice_no_unique idx_payments_payment_no_unique)
          for index_name in "${required[@]}"; do
            grep -RlF "$index_name" apps/pocketbase/pb_migrations >/dev/null || { echo "Missing $index_name"; exit 1; }
          done
      - name: Verify unique migrations are idempotent
        run: |
          files=$(grep -RlE 'CREATE UNIQUE INDEX (idx_programmes_code_unique|idx_quotations_quote_no_unique|idx_purchase_orders_po_no_unique|idx_invoices_invoice_no_unique|idx_payments_payment_no_unique)' apps/pocketbase/pb_migrations || true)
          for file in $files; do grep -q 'indexes\.some' "$file" || { echo "Not idempotent: $file"; exit 1; }; done
      - name: Validate V1 migration
        run: php -l tools/migrate-v1-to-v2.php
      - name: Validate PocketBase hook
        run: node --check apps/pocketbase/pb_hooks/financial_integrity.pb.js
      - name: Validate role smoke script
        run: bash -n tools/role-matrix-smoke.sh

  deployment-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin mimos-pms || true
      - run: sudo mkdir -p /var/www/mimos-pms/apps/pocketbase && sudo ln -sf /usr/bin/true /var/www/mimos-pms/apps/pocketbase/pocketbase
      - run: systemd-analyze verify systemd/mimos-pms.service
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Validate NGINX
        run: |
          mkdir -p /tmp/mimos-nginx/logs /tmp/mimos-nginx/run
          sed -e 's/listen 80;/listen 8080;/' -e 's/listen \[::\]:80;/listen [::]:8080;/' nginx/mimos-pms-api.conf > /tmp/mimos-nginx/mimos-pms-api.conf
          cat > /tmp/mimos-nginx/nginx.conf <<'EOF'
          pid /tmp/mimos-nginx/run/nginx.pid;
          error_log /tmp/mimos-nginx/logs/error.log;
          events {}
          http {
            access_log /tmp/mimos-nginx/logs/access.log;
            include /etc/nginx/mime.types;
            include /tmp/mimos-nginx/mimos-pms-api.conf;
          }
          EOF
          nginx -t -c /tmp/mimos-nginx/nginx.conf

  pocketbase-smoke:
    runs-on: ubuntu-latest
    needs: migration-static-check
    steps:
      - uses: actions/checkout@v5
      - name: Verify PocketBase version
        working-directory: apps/pocketbase
        run: |
          chmod +x pocketbase
          expected="$(tr -d '\r\n' < .pocketbase-version)"
          actual="$(./pocketbase --version | head -n1)"
          echo "$actual" | grep -F "$expected"
      - name: Fresh migration
        working-directory: apps/pocketbase
        env:
          PB_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          PB_SUPERUSER_EMAIL: ci-admin@example.com
          PB_SUPERUSER_PASSWORD: CiTest-Password-2026-Strong!
        run: |
          rm -rf /tmp/mimos-pb-smoke
          mkdir -p /tmp/mimos-pb-smoke
          ./pocketbase migrate up --encryptionEnv=PB_ENCRYPTION_KEY --dir=/tmp/mimos-pb-smoke --migrationsDir=./pb_migrations --hooksDir=./pb_hooks
          test -f /tmp/mimos-pb-smoke/data.db
      - name: Boot, bootstrap superuser, authenticate, and run E2E
        working-directory: apps/pocketbase
        env:
          PB_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          PB_SUPERUSER_EMAIL: ci-admin@example.com
          PB_SUPERUSER_PASSWORD: CiTest-Password-2026-Strong!
          PB_BASE_URL: http://127.0.0.1:8090
        run: |
          ./pocketbase superuser upsert "$PB_SUPERUSER_EMAIL" "$PB_SUPERUSER_PASSWORD" --dir=/tmp/mimos-pb-smoke
          ./pocketbase serve --http=127.0.0.1:8090 --encryptionEnv=PB_ENCRYPTION_KEY --dir=/tmp/mimos-pb-smoke --migrationsDir=./pb_migrations --hooksDir=./pb_hooks >/tmp/mimos-pocketbase.log 2>&1 &
          PB_PID=$!
          trap 'kill $PB_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS "$PB_BASE_URL/api/health" >/dev/null && break || sleep 1; done
          curl -fsS "$PB_BASE_URL/api/health" >/dev/null || { cat /tmp/mimos-pocketbase.log; exit 1; }
          auth_status=$(curl -sS -o /tmp/mimos-auth.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "{\"identity\":\"$PB_SUPERUSER_EMAIL\",\"password\":\"$PB_SUPERUSER_PASSWORD\"}" "$PB_BASE_URL/api/collections/_superusers/auth-with-password")
          [ "$auth_status" = 200 ] || { cat /tmp/mimos-auth.json; cat /tmp/mimos-pocketbase.log; exit 1; }
          bash ../../tools/role-matrix-smoke.sh
