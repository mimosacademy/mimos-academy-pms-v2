name: V2 Quality Gate

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  migration-static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify migration field constructors
        run: |
          if grep -R "col\.fields\.add(new Field" apps/pocketbase/pb_migrations; then
            echo "Untyped Field constructor found in migrations."
            exit 1
          fi
      - name: Verify no production data directory is tracked
        run: |
          if git ls-files apps/pocketbase/pb_data | grep -q .; then
            echo "pb_data must never be committed."
            exit 1
          fi
      - name: Verify no demo action handlers remain
        run: |
          if grep -R "demoAction" apps/web/src --include='*.js' --include='*.jsx'; then
            echo "demoAction reference found in production source."
            exit 1
          fi
      - name: Verify mock data is not imported by production source
        run: |
          if grep -R "mockData" apps/web/src --include='*.js' --include='*.jsx' | grep -v '/lib/mockData.js:'; then
            echo "mockData import/reference found in production source."
            exit 1
          fi
      - name: Verify critical business identifiers have unique database constraints
        run: |
          declare -A required_fields=(
            [idx_programmes_code_unique]=code
            [idx_quotations_quote_no_unique]=quoteNo
            [idx_purchase_orders_po_no_unique]=poNo
            [idx_invoices_invoice_no_unique]=invoiceNo
            [idx_payments_payment_no_unique]=paymentNo
          )
          migration_file="apps/pocketbase/pb_migrations/1787660000_add_business_identifier_uniques.js"
          test -f "$migration_file" || { echo "Business identifier uniqueness migration missing: $migration_file"; exit 1; }
          for index_name in "${!required_fields[@]}"; do
            if ! grep -Fq "\"${index_name}\"" "$migration_file"; then
              echo "Missing unique business identifier declaration: ${index_name}"
              exit 1
            fi
          done
          if ! grep -Fq 'CREATE UNIQUE INDEX ${indexName}' "$migration_file"; then
            echo "Business identifier migration does not create UNIQUE indexes through the migration template."
            exit 1
          fi
          echo "All critical business identifier unique indexes are declared in the canonical migration."
      - name: Validate V1 migration PHP syntax
        run: php -l tools/migrate-v1-to-v2.php
      - name: Verify V1 opportunity stages are mapped to V2 schema
        run: |
          if grep -nE "'stage' => \$stage|stageForV2" tools/migrate-v1-to-v2.php >/dev/null && grep -nE "'stage' => '(Early engagement|Qualified lead/Tender in progress|Proposal/Tender submitted|Negotiation stage|Verbal commitment|Contract signed/PO issued|Lost/No-go)'" tools/migrate-v1-to-v2.php >/dev/null; then
            echo "V1-only opportunity stage value is being written directly to V2."
            exit 1
          fi
      - name: Validate PocketBase hook syntax
        run: node --check apps/pocketbase/pb_hooks/financial_integrity.pb.js
