name: V2 Quality Gate

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  supabase-static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify production architecture is Supabase
        run: |
          grep -q "Supabase Auth + PostgreSQL + Storage + Realtime" README.md
          grep -q "Supabase + Vercel" docs/DEPLOYMENT.md
      - name: Verify security migrations exist and are uniquely numbered
        run: |
          test -f supabase/migrations/015_migration_function_security.sql
          test -f supabase/migrations/016_security_integrity_hardening.sql
          test -f supabase/migrations/017_authorization_boundary_hardening.sql
          test "$(find supabase/migrations -maxdepth 1 -type f -name '015_*.sql' | wc -l)" -eq 1
          test "$(find supabase/migrations -maxdepth 1 -type f -name '016_*.sql' | wc -l)" -eq 1
          test "$(find supabase/migrations -maxdepth 1 -type f -name '017_*.sql' | wc -l)" -eq 1
      - name: Verify no broad sensitive RLS policy was reintroduced
        run: |
          if grep -R -nE "create policy .*on public\.(invoice|payment|payment_allocation|invoice_payment_allocation|audit_log|audit_history).*using \(true\)" supabase/migrations; then
            echo "Broad sensitive-table RLS policy detected"; exit 1
          fi
      - name: Verify final authorization boundary is private-schema based
        run: |
          if grep -nE "create or replace function public\.(has_pms_role|can_access_programme|current_staff_id)" supabase/migrations/017_authorization_boundary_hardening.sql; then
            echo "Authorization helper exposed in API schema"; exit 1
          fi
          grep -q "revoke all on function public.is_admin() from public, anon, authenticated" supabase/migrations/017_authorization_boundary_hardening.sql
          grep -q "revoke all on function public.fn_refresh_programme(bigint) from public, anon, authenticated" supabase/migrations/017_authorization_boundary_hardening.sql
          grep -q "revoke all on function public.fn_programme_completeness(bigint) from public, anon, authenticated" supabase/migrations/017_authorization_boundary_hardening.sql
      - name: Verify staging promotion is service-role only
        run: |
          for f in supabase/migrations/*.sql; do
            if grep -q "promote_stg_" "$f"; then
              grep -q "revoke.*promote_stg_.*authenticated" "$f" || {
                echo "Staging promotion function is not explicitly revoked from authenticated"; exit 1;
              }
            fi
          done
      - name: Verify frontend never contains service-role credentials
        run: |
          if grep -R -nEi "SUPABASE_SERVICE_ROLE_KEY|service_role|service-role" apps/web/src apps/web/.env.example; then
            echo "Service-role credential/reference found in browser source"; exit 1
          fi
      - name: Verify browser source does not import PocketBase
        run: |
          if grep -R -nEi "pocketbase|pb_client|apps/pocketbase" apps/web/src --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx'; then
            echo "PocketBase runtime reference found in web application"; exit 1
          fi
      - name: Verify production data is not tracked
        run: |
          if git ls-files apps/pocketbase/pb_data | grep -q .; then exit 1; fi
      - name: Verify no obvious secrets are committed
        run: |
          if git grep -nEI -- '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^$\{]|sk-[A-Za-z0-9_-]{20,}|password[[:space:]]*[:=][[:space:]]*["'"'][^"'"']{12,})' -- ':!*.md' ':!docs/*'; then
            echo "Potential hard-coded secret detected"; exit 1
          fi
      - name: Validate financial, storage and authorization markers
        run: |
          grep -q "private.validate_financial_invariants" supabase/migrations/016_security_integrity_hardening.sql
          grep -q "ux_payment_operation_id" supabase/migrations/016_security_integrity_hardening.sql
          grep -q "pms_documents_select" supabase/migrations/016_security_integrity_hardening.sql
          grep -q "prevent_staff_security_field_escalation" supabase/migrations/017_authorization_boundary_hardening.sql
          grep -q "prevent_profile_security_field_escalation" supabase/migrations/017_authorization_boundary_hardening.sql

  deployment-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify Vercel configuration exists
        run: test -f apps/web/vercel.json
      - name: Verify production runbook has no PocketBase deployment instructions
        run: |
          if grep -nEi 'Hostinger VPS for PocketBase|PocketBase backend/database/authentication|start.*PocketBase|deploy.*PocketBase' docs/DEPLOYMENT.md; then
            echo "Legacy PocketBase production instruction detected"; exit 1
          fi
